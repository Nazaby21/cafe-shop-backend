name: ci

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No mock data outside tests/
        run: python scripts/check_mock_patterns.py
      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env files must not be committed"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user_service, operation_service, report_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check ${{ matrix.service }}
      - name: pytest
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q
