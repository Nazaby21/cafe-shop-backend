openapi: 3.0.3

info:
  title: User Management API
  description: API for managing users
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: User
    description: User management operations

paths:

  /user:
    post:
      tags:
        - User
      summary: Register a new user
      description: Create a new user account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          description: Invalid request


    get:
      tags:
        - User
      summary: Get all users
      description: Get a paginated list of users.

      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Users fetched successfully

        '401':
          description: Unauthorized

        '403':
          description: Forbidden


  /user/login:
    post:
      tags:
        - User
      summary: User login
      description: Authenticate a user and return an access token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login successful

        '401':
          description: Invalid credentials


  /user/me:
    get:
      tags:
        - User
      summary: Get current user
      description: Get the currently authenticated user's information.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Current user information

        '401':
          description: Unauthorized


  /user/{user_id}:
    get:
      tags:
        - User
      summary: Get user by ID

      security:
        - bearerAuth: []

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User found

        '403':
          description: Forbidden

        '404':
          description: User not found


    put:
      tags:
        - User
      summary: Update user

      security:
        - bearerAuth: []

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'

      responses:
        '200':
          description: User updated successfully

        '403':
          description: Forbidden


    delete:
      tags:
        - User
      summary: Delete user

      security:
        - bearerAuth: []

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User deleted successfully

        '403':
          description: Forbidden


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: john
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password123


    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password123


    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          example: john
        email:
          type: string
          format: email
          example: john@example.com


    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john
        email:
          type: string
          example: john@example.com
        role:
          type: string
          example: user